server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Redirection /pdf vers le CV
  location = /pdf {
    default_type application/pdf;
    alias /usr/share/nginx/html/CV_BARRAT_Nicolas.pdf;
    expires 1d;
    add_header Cache-Control "public, must-revalidate";
  }

  # toutes les autres routes -> index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache agressif pour assets hashés
  location ~* \.(?:css|js|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
