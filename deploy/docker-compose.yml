services:
  cv:
    container_name: cv
    build:
      context: ../client
      dockerfile: Dockerfile
      pull: true
    ports:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
